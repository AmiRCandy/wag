[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co2-wag-pipeline"
version = "0.1.0"
description = "B-only WAG model development and frozen external simulation testing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "pandas>=1.5", "scipy>=1.10",
    "scikit-learn>=1.3", "joblib>=1.3", "threadpoolctl>=3.1", "tqdm>=4.66"
]

[project.optional-dependencies]
trees = ["xgboost>=1.7", "lightgbm>=3.3"]
neural = ["torch>=2.0"]
plots = ["matplotlib>=3.7", "seaborn>=0.12"]

[tool.setuptools.packages.find]
include = ["wag", "wag.*"]
